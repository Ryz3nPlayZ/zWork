<dialog class="onboard" id="onboard" aria-labelledby="ob-title" open=""><div class="ob">
    <div class="ob__top">
      <button type="button" class="ob__back" data-ob="back">Back</button>
      <div class="ob__progress" aria-label="Question 3 of 3"><span class="is-on"></span><span class="is-on"></span><span class="is-on"></span></div>
      <button type="button" class="ob__skip" data-ob="skip">Skip</button>
    </div>
    <div class="ob__step" style="--from:24px"><h2 class="ob__title" id="ob-title" tabindex="-1">What are you into?</h2>
      <p class="ob__lede">Pick as many as you like. They go first on your For you page.</p>
      <div class="picks picks--two" role="group" aria-labelledby="ob-title"><button type="button" class="pick pick--ob" data-ob-into="study" aria-pressed="false"><span class="bullet bullet--sm bullet--study" aria-hidden="true">S</span>Study spots</button><button type="button" class="pick pick--ob" data-ob-into="tutoring" aria-pressed="false"><span class="bullet bullet--sm bullet--tutoring" aria-hidden="true">T</span>Tutoring</button><button type="button" class="pick pick--ob" data-ob-into="music" aria-pressed="false"><span class="bullet bullet--sm bullet--music" aria-hidden="true">M</span>Music</button><button type="button" class="pick pick--ob" data-ob-into="volunteering" aria-pressed="false"><span class="bullet bullet--sm bullet--volunteering" aria-hidden="true">V</span>Volunteering</button><button type="button" class="pick pick--ob" data-ob-into="workshop" aria-pressed="false"><span class="bullet bullet--sm bullet--workshop" aria-hidden="true">W</span>Workshops</button><button type="button" class="pick pick--ob" data-ob-into="support" aria-pressed="false"><span class="bullet bullet--sm bullet--support" aria-hidden="true">H</span>Student support</button><button type="button" class="pick pick--ob" data-ob-into="explore" aria-pressed="false"><span class="bullet bullet--sm bullet--explore" aria-hidden="true">E</span>Places to explore</button><button type="button" class="pick pick--ob" data-ob-into="jobs" aria-pressed="false"><span class="bullet bullet--sm bullet--jobs" aria-hidden="true">J</span>Jobs and internships</button></div></div>
    <div class="ob__foot">
      <button type="button" class="btn btn--sun btn--block" data-ob="next" disabled="">Show me what's on</button>
      
    </div>
  </div></dialog>
