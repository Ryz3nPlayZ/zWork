<script>
/* ───────────────────────── motion helpers ───────────────────────── */
const DUR = 100.0;
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
function stepR(tau, { w, z }) { if (tau <= 0) return 0; if (z >= 1) { const x = w * tau; return 1 - Math.exp(-x) * (1 + x); } const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + (z * w / wd) * Math.sin(wd * tau)); }
/* Track: closed-form spring events; set() is an instant jump (used where a drag hands the cursor back) */
class Track { constructor(v0) { this.v0 = v0; this.cur = v0; this.ev = []; } to(t, v, sp) { if (v !== this.cur) { this.ev.push([t, v - this.cur, sp]); this.cur = v; } return this; } set(t, v) { if (v !== this.cur) { this.ev.push([t, v - this.cur, null]); this.cur = v; } return this; } at(t) { let v = this.v0; for (const [ti, d, sp] of this.ev) v += d * (sp ? stepR(t - ti, sp) : (t >= ti ? 1 : 0)); return v; } }
function vis(t, tin, tout, dOut = 0.12) { const e = stepR(t - tin, { w: 26, z: 1 }), x = tout == null ? 0 : clamp((t - tout) / dOut), xo = x * x; return { o: e * (1 - xo), b: (1 - e) * 10 + xo * 10, dy: (1 - e) * 16 - xo * 10, e }; }

const press = (t, tc) => 1 - 0.16 * Math.exp(-(((t - tc) / 0.045) ** 2));
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const rgb = (a, al = 1) => `rgba(${a.map(v => Math.round(clamp(v, 0, 255))).join(',')},${al})`;
const mix = (a, b, u) => a.map((v, i) => lerp(v, b[i], u));
const eio = u => (u = clamp(u), u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const backOut = (u, s = 2.2) => (u = clamp(u) - 1, u * u * ((s + 1) * u + s) + 1);
const SP = { ui:{w:15,z:.82}, fast:{w:24,z:.85}, cam:{w:6,z:1}, camP:{w:9,z:.86}, drift:{w:1.6,z:1}, cur:{w:9,z:.92}, curS:{w:4.5,z:1}, pop:{w:18,z:.78} };
const M = { cues: [], DUR }; const cue = (t, k, v = 0) => M.cues.push({ t: +t.toFixed(4), k, v });
function bez(x1, y1, x2, y2) { return u => { u = clamp(u); if (u === 0 || u === 1) return u; let lo = 0, hi = 1, s = u; for (let i = 0; i < 26; i++) { s = (lo + hi) / 2; const x = 3 * (1 - s) * (1 - s) * s * x1 + 3 * (1 - s) * s * s * x2 + s * s * s; if (x < u) lo = s; else hi = s; } return 3 * (1 - s) * (1 - s) * s * y1 + 3 * (1 - s) * s * s * y2 + s * s * s; }; }
const eDrawer = bez(.32, .72, 0, 1), eOut = bez(.23, 1, .32, 1);
const vis2 = (el, t, tin, tout, extra) => applyVis(el, vis(t, tin, tout), extra);

/* ───────────────────────── palette ───────────────────────── */
const C = { seven: '#B933AD', deep: '#8E2386', sevenInk: '#7A1F72', soft: '#F6E4F3', sun: '#FFC72C', bg: '#F3EEF7', ink: '#1F1430', ink2: '#5D5370', line: '#DED4E8' };
const KIND = { study: ['S', '#0039A6', '#fff'], tutoring: ['T', '#D52B1E', '#fff'], music: ['M', '#FF6319', C.ink], volunteering: ['V', '#6CBE45', C.ink], workshop: ['W', '#FCCC0A', C.ink], support: ['H', '#00796F', '#fff'], explore: ['E', '#00933C', C.ink], jobs: ['J', '#996633', '#fff'] };
const KORDER = ['study', 'tutoring', 'music', 'volunteering', 'workshop', 'support', 'explore', 'jobs'];

/* ───────────────────────── the film's clock ───────────────────────── */
const T = { GET: 38.5, AGE15: 39.75, NEXT1: 40.6, CORONA: 41.75, NEXT2: 42.6, I1: 43.5, I2: 44.0, I3: 44.5, SHOW: 45.5,
  EXPLORE: 51.5, NOW: 52.5, MAP: 66.9, LIST: 70.7, OPEN1: 71.5, SAVE1: 75.6, INVITE: 76.8, CLOSE1: 80.0, OPEN2: 81.15,
  SAVE2: 82.6, CAL: 83.5, CLOSE2: 84.7, SAVED: 85.6, SHARE: 86.9, PEEK0: 56.0, PEEK1: 64.95, OUT: 89.0, END: 95.0 };
const ST = { age: T.GET + 0.06, hood: T.NEXT1 + 0.06, into: T.NEXT2 + 0.06, close: T.SHOW + 0.06, nowSw: T.NOW + 0.06, mapSw: T.MAP + 0.06, listSw: T.LIST + 0.06, savedSw: T.SAVED + 0.06 };

/* ───────────────────────── phone screens: the real app's markup in iframes ───────────────────────── */
const FR = {};
const FRAME_LIST = [['app', 'home'], ['now', 'explore-now'], ['map', 'explore-map'], ['saved', 'saved'], ['into', 'ob-into0'], ['hood', 'ob-hood0'], ['age', 'ob-age0'], ['welcome', 'ob-welcome']];
const SHEETS = [['scor', 'd-cor'], ['sqm', 'd-qm']];
function srcdoc(snap, extra = '') {
  return `<!doctype html><html><head><meta charset="utf-8"><style>${APP.fonts}</style><style>${APP.css}</style><style>*{animation:none!important;transition:none!important}:root{--safe-t:54px;--safe-b:22px}html{scrollbar-width:none}::-webkit-scrollbar{display:none}${extra}</style></head><body>${APP.snaps[snap]}</body></html>`;
}
function mkFrame(name, snap, host, extra) {
  const f = document.createElement('iframe'); f.className = 'f'; f.srcdoc = srcdoc(snap, extra); f.style.visibility = 'hidden';
  host.appendChild(f); FR[name] = { el: f };
  return new Promise(ok => f.onload = () => { FR[name].doc = f.contentDocument; ok(); });
}
const loads = [...FRAME_LIST.map(([n, s]) => mkFrame(n, s, $('frames'))), ...SHEETS.map(([n, s]) => mkFrame(n, s, $('sheets'), 'html,body{background:transparent!important}'))];

const q = (n, sel, i = 0) => FR[n].doc.querySelectorAll(sel)[i];
function fixups() {
  for (const n of ['app', 'now', 'map', 'saved']) {
    const d = FR[n].doc, bar = d.createElement('div');
    bar.className = 'appbar'; bar.id = 'appbar'; bar.innerHTML = '<span id="appbar-title"></span>';
    d.body.insertBefore(bar, d.body.firstChild);
  }
  /* Leaflet's CSS is CDN-only, so the map is the captured tile image with the real pins placed on it */
  const m = q('map', '#map'); m.className = ''; m.removeAttribute('style');
  m.style.position = 'relative';
  m.innerHTML = `<img src="app/map-tiles.png" style="position:absolute;inset:0;width:100%;height:100%;display:block">` + APP.map.pins.map((p, i) => {
    const inner = (p.html.match(/<span class="(bullet[^"]*|pin-origin)"[^>]*>[^<]*<\/span>/) || [''])[0];
    return `<div class="pin" data-i="${i}" style="position:absolute;left:${p.x - p.w / 2}px;top:${p.y - p.h / 2}px;width:${p.w}px;height:${p.h}px;display:grid;place-items:center">${inner}</div>`;
  }).join('');
  for (const [n, img] of [['scor', 'd-cor'], ['sqm', 'd-qm']]) {
    const mm = q(n, '#minimap'); if (!mm) continue;
    mm.className = ''; mm.removeAttribute('style'); mm.style.position = 'relative';
    mm.innerHTML = `<img src="app/${img}-minimap.png" style="width:100%;height:100%;object-fit:cover;display:block">`;
  }
  const sv = q('saved', '#appbar-title'); if (sv) sv.textContent = 'Saved';
}

/* geometry: element rects in app coordinates, measured with every document at scroll 0 */
function R(n, sel, i = 0) { const e = q(n, sel, i); if (!e) throw new Error(`missing ${n} ${sel}`); const r = e.getBoundingClientRect(); return { x: r.x, y: r.y, w: r.width, h: r.height, cx: r.x + r.width / 2, cy: r.y + r.height / 2 }; }

/* ───────────────────────── scrolling: drag with finger, then momentum ───────────────────────── */
class Scroll {
  constructor(v0 = 0) { this.v0 = v0; this.ev = []; }
  drag(t0, D, dur = 0.36, f = 0.42) { this.ev.push({ k: 'd', t0, D, dur, f }); return this; }
  jump(t0, v) { this.ev.push({ k: 'j', t0, v }); return this; }
  at(t) {
    let s = this.v0;
    for (const e of this.ev) {
      if (t < e.t0) break;
      if (e.k === 'j') { s = e.v; continue; }
      const u = (t - e.t0) / e.dur;
      if (u <= 1) s += e.f * e.D * u * u;
      else { const tau = (1 - e.f) * e.dur / (2 * e.f); s += e.f * e.D + (1 - e.f) * e.D * (1 - Math.exp(-(t - e.t0 - e.dur) / tau)); }
    }
    return s;
  }
}
const SC = { home: new Scroll(), ex: new Scroll(), scor: new Scroll(), sqm: new Scroll() };

/* ───────────────────────── camera and phone ───────────────────────── */
const CAM = { x: new Track(0), y: new Track(0), lz: new Track(0) };
const cam = t => ({ x: CAM.x.at(t), y: CAM.y.at(t), z: Math.exp(CAM.lz.at(t)) });
const toScreen = (t, wx, wy) => { const c = cam(t); return [960 + (wx - c.x) * c.z, 540 + (wy - c.y) * c.z]; };
const DZ = 1.04, FX = 435;
/* close-ups use a smaller offset so zoomed detail stays inside the frame */
function frame(t, wx, wy, z, sp = SP.cam) { CAM.x.to(t, wx - (z > 1.2 ? 380 : FX) / z, sp); CAM.y.to(t, wy, sp); CAM.lz.to(t, Math.log(z), sp); }
const P = { y: new Track(1300), r: new Track(7), s: new Track(0.92) };
P.y.to(15.35, 0, { w: 6.2, z: 0.9 }); P.r.to(15.35, 0, { w: 5.5, z: 1 }); P.s.to(15.35, 1, { w: 5.5, z: 1 });
P.y.to(T.OUT + 0.05, 1350, { w: 5.5, z: 1 }); P.r.to(T.OUT + 0.05, -6, { w: 4, z: 1 });
cue(15.35, 'rise');
/* app coordinates → world (the phone sits at the world origin for the whole demo) */
const A2W = (ax, ay) => [ax - 195, ay - 422];

/* camera script before the demo */
CAM.x.to(16.85, -FX, SP.cam); cue(16.85, 'whoosh', 0.3);
CAM.lz.to(17.2, Math.log(1.02), { w: 0.9, z: 1 });
CAM.x.to(28.9, -FX / 0.94, SP.cam); CAM.lz.to(28.9, Math.log(0.94), SP.cam);
frame(36.3, 0, 0, DZ, SP.camP); cue(36.3, 'whooshBig');

/* ───────────────────────── cursor ───────────────────────── */
const ARROW = (fill, stroke) => `<svg width="34" height="40" viewBox="0 0 34 40" style="position:absolute;left:-3px;top:-2px;overflow:visible"><path d="M3 2.5v29.2l7.6-6.9 5 11.4 5.4-2.4-5-11.1 10.3-.6z" fill="${fill}" stroke="${stroke}" stroke-width="2.4" stroke-linejoin="round"/></svg>`;
$('cur').innerHTML = `<div class="body" style="position:absolute;transform-origin:3px 2px">${ARROW(C.ink, '#fff')}</div>`;
const U = { x: new Track(330), y: new Track(260), clicks: [], holds: [], drags: [], win: [[37.6, 55.55], [65.45, 88.85]] };
function go(c, t, x, y, sp = SP.cur) { c.x.to(t, x, sp); c.y.to(t, y, sp); }
function click(c, t, k = 'click') { c.clicks.push(t); cue(t, k); }
/* pressed-feedback targets inside the app: { frame, selector, index, t } */
const PRESS = [];
function tap(t, n, sel, ay, opt = {}) {
  const [wx, wy] = A2W(ay.x, ay.y);
  go(U, t - (opt.lead || 0.5), wx + (opt.dx || 0), wy + (opt.dy || 0), opt.sp || SP.cur);
  click(U, t, opt.k || 'tap');
  if (sel) PRESS.push({ n, sel, i: opt.i || 0, t });
}
function drag(t0, sc, D, ax, ay, dur = 0.36, f = 0.42) {
  SC[sc].drag(t0, D, dur, f);
  const [wx, wy] = A2W(ax, ay);
  go(U, t0 - 0.5, wx, wy);
  U.drags.push({ t0, dur, f, D, wx, wy }); U.holds.push([t0 - 0.03, t0 + dur + 0.04]);
  U.x.set(t0 + dur, wx); U.y.set(t0 + dur, wy - f * D);
  cue(t0, 'drag', Math.min(1, Math.abs(D) / 600));
}
function curW(t) {
  for (const d of U.drags) if (t >= d.t0 && t <= d.t0 + d.dur) { const u = (t - d.t0) / d.dur; return [d.wx, d.wy - d.f * d.D * u * u]; }
  return [U.x.at(t), U.y.at(t)];
}

const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function hl(line) {
  let out = '', m; const re = /(\/\/.*$)|('[^']*'|"[^"]*")|\b(function|const|let|if|else|return|null)\b|\b(\d+)\b/g; let last = 0;
  while ((m = re.exec(line))) { out += esc(line.slice(last, m.index)); const cls = m[1] ? 'c' : m[2] ? 's' : m[3] ? 'k' : 'n'; out += `<span class="${cls}">${esc(m[0])}</span>`; last = re.lastIndex; }
  return out + esc(line.slice(last));
}

  for (const [a, b] of U.holds) pr = Math.min(pr, 1 - 0.14 * Math.min(clamp((t - a) / 0.05), clamp((b - t) / 0.08)));
  el.style.transform = `translate(${sx.toFixed(2)}px,${sy.toFixed(2)}px) scale(1.25)`;
  el.querySelector('.body').style.transform = `rotate(${lean.toFixed(2)}deg) scale(${pr.toFixed(4)})`;
}
function drawRipples(t) {
  let n = 0;
  for (const tc of U.clicks) {
    const u = (t - tc) / 0.4; if (u < 0 || u > 1 || n >= ripplePool.length) continue;
    const [wx, wy] = curW(tc), [sx, sy] = toScreen(t, wx, wy); const R = 10 + 40 * (1 - (1 - u) ** 3);
    const d = ripplePool[n++]; d.style.display = 'block';
    d.style.left = (sx - R) + 'px'; d.style.top = (sy - R) + 'px'; d.style.width = d.style.height = 2 * R + 'px';
    d.style.opacity = (0.45 * (1 - u)).toFixed(3);
  }
  for (; n < ripplePool.length; n++) ripplePool[n].style.display = 'none';
}

function drawStats(t) {
  STATS.forEach((s, i) => {
    applyVis(s.e, vis(t, 89.45 + 0.12 * i, 94.6 + 0.05 * i, 0.16));
    const u = eio((t - (89.6 + 0.2 * i)) / 1.6), V = s.v * u;
    s.strips.forEach((st, k) => {
      const Pw = 10 ** (s.strips.length - 1 - k);
      const d = Math.floor(V / Pw) % 10 + Math.max(0, (V % Pw) - (Pw - 1));
      st.style.transform = `translateY(${(-d * 170).toFixed(2)}px)`;
    });
  });
}

function seek(t) {
  t = clamp(t, 0, DUR);
  const c = cam(t);
  $('world').style.transform = `translate(960px,540px) scale(${c.z.toFixed(5)}) translate(${(-c.x).toFixed(3)}px,${(-c.y).toFixed(3)}px)`;
  drawBg(t); drawIntro(t); drawCards(t); drawCaps(t); drawPhone(t); drawPeek(t); drawStats(t); drawCursor(t); drawRipples(t);
}

window.seek = seek; window.M = M;
Promise.all([document.fonts.ready, ...loads]).then(async () => {
  for (const n in FR) await FR[n].doc.fonts.ready;
  fixups();
  await Promise.all([...document.images, ...Object.values(FR).flatMap(f => [...f.doc.images])].map(im => im.complete ? 0 : new Promise(ok => { im.onload = im.onerror = ok; })));
  WMW = $('wordmark').offsetWidth;
  plan();
  /* rank: the 13 survivors slide to the front in the order the app lists them */
  const order = [...FR.now.doc.querySelectorAll('#list .card__name')].map(b => b.dataset.open);
  let kept = 0, dropped = order.length;
  DOTS.forEach(dt => { const r = order.indexOf(dt.l.id); dt.rank = r >= 0 ? r : dropped++; });
  DOTS.forEach((dt, i) => dt.x.to(62.8 + 0.025 * i, dt.rank, { w: 13, z: 0.9 }));
  for (const c of CAPS) { if (c.top == null) c.d.style.top = (540 - c.d.offsetHeight / 2) + 'px'; else c.d.style.top = c.top + 'px'; }
  M.cues.sort((a, b) => a.t - b.t);
  const qs = new URLSearchParams(location.search);
  seek(+(qs.get('t') || 0));
  window.READY = true;
});
</script>
