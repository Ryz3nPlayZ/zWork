name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.3.0"
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify preconditions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch the tag's target commit explicitly and refuse to build
          # from a stale HEAD. Without this, a force-pushed/moved tag can
          # race and ship binaries built from the previous commit (the
          # v0.5.0 release shipped beta.12 binaries for exactly this reason).
          fetch-depth: 0

      - name: Verify tag points to the checked-out commit
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          TAGGED_SHA="$(git rev-list -n 1 "$TAG_NAME")"
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          echo "tag $TAG_NAME points to: $TAGGED_SHA"
          echo "checked-out HEAD:       $CHECKED_OUT_SHA"
          if [ "$TAGGED_SHA" != "$CHECKED_OUT_SHA" ]; then
            echo "::error::Refusing to release: tag $TAG_NAME points to $TAGGED_SHA but the workflow checked out $CHECKED_OUT_SHA. This happens when a tag is deleted and recreated while an old release run is still in flight. Re-trigger the release workflow on the current tag." >&2
            exit 1
          fi

      - name: Verify version sync
        run: python3 scripts/check-version-sync.py

      - name: Verify version matches release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="${TAG_NAME#v}"
          REPO_VERSION="$(python3 scripts/check-version-sync.py)"
          echo "tag version:    $TAG_VERSION"
          echo "repo version:   $REPO_VERSION"
          if [ "$TAG_VERSION" != "$REPO_VERSION" ]; then
            echo "::error::Refusing to release: tag $TAG_NAME (version $TAG_VERSION) does not match the in-repo version ($REPO_VERSION). Bump all version files to $TAG_VERSION before tagging." >&2
            exit 1
          fi

      - name: Verify updater signing secret
        shell: bash
        run: |
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is missing. Add the updater private key as a GitHub Actions secret."
            exit 1
          fi

      - name: Warn if code-signing secrets are missing
        # NOT a hard failure — unsigned dev/preview builds are legitimate.
        # Warn so a "stable" tag never ships unsigned by accident: the release
        # notes below mention signing only when the secrets are present, and
        # reviewers see a clear signal here.
        shell: bash
        run: |
          if [ -z "${{ secrets.APPLE_SIGNING_IDENTITY }}" ]; then
            echo "::warning::APPLE_SIGNING_IDENTITY not set — macOS build will ship UNSIGNED (Gatekeeper prompt on every install)."
          fi
          if [ -z "${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}" ]; then
            echo "::warning::WINDOWS_CERTIFICATE_THUMBPRINT not set — Windows build will ship UNSIGNED (SmartScreen warning on every install)."
          fi

  build:
    needs: verify
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Windows Authenticode signing. When set, Tauri's NSIS bundler signs the
      # installer (.exe) with the matching certificate — clears SmartScreen
      # warnings. Optional: if unset, the build ships unsigned (same as today).
      # WINDOWS_CERTIFICATE_THUMBPRINT must point at a cert installed into the
      # runner's cert store (imported in a step below).
      WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            build_script: scripts/build-linux-release.sh
          - os: windows-latest
            platform: windows
            build_script: scripts/build-windows-release.ps1

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri -> target
            sidecar-rust -> target

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        run: npm ci
        working-directory: app

      - name: Import Windows code-signing certificate
        # Only on Windows AND when a cert base64 is configured. Installs the
        # PFX into the CurrentUser\My store so the NSIS bundler can find it by
        # thumbprint. Skip entirely on Linux/other matrix entries.
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE_BASE64 != ''
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        shell: pwsh
        run: |
          $pfxBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          $pfxPath = Join-Path $env:RUNNER_TEMP "zwork-cert.pfx"
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
          $securePass = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePass

      - name: Download cua-driver (${{ matrix.platform }})
        shell: bash
        run: |
          CUA_VERSION="0.5.7"
          case "${{ matrix.platform }}" in
            linux)
              curl -fsSL "https://github.com/trycua/cua/releases/download/cua-driver-rs-v${CUA_VERSION}/cua-driver-rs-${CUA_VERSION}-linux-x86_64-binary.tar.gz" -o /tmp/cua.tar.gz
              tar -xzf /tmp/cua.tar.gz -C /tmp/
              cp /tmp/cua-driver app/src-tauri/binaries/cua-driver
              chmod +x app/src-tauri/binaries/cua-driver
              ;;
            windows)
              curl -fsSL "https://github.com/trycua/cua/releases/download/cua-driver-rs-v${CUA_VERSION}/cua-driver-rs-${CUA_VERSION}-windows-x86_64-binary.zip" -o /tmp/cua.zip
              unzip -o /tmp/cua.zip -d /tmp/
              cp /tmp/cua-driver.exe app/src-tauri/binaries/cua-driver.exe 2>/dev/null || cp /tmp/cua-driver app/src-tauri/binaries/cua-driver.exe
              ;;
          esac

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash ${{ matrix.build_script }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File ${{ matrix.build_script }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: dist/*

  macos-backend:
    needs: verify
    name: macOS Rust backend (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - arch: aarch64
            os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sidecar-rust -> target

      - name: Build Rust backend
        run: bash scripts/build-rust-backend.sh ${{ matrix.target }}

      - name: Upload backend
        uses: actions/upload-artifact@v4
        with:
          name: macos-backend-${{ matrix.arch }}
          path: app/src-tauri/binaries/zwork-backend-${{ matrix.target }}

  macos-universal:
    name: macOS universal build
    needs: [verify, macos-backend]
    runs-on: macos-15
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # NOTE: APPLE_SIGNING_IDENTITY is intentionally NOT set here. GitHub
      # Actions resolves an unset secret to an empty string, and Tauri treats a
      # *present but empty* APPLE_SIGNING_IDENTITY as "sign with this (empty)
      # identity" — which fails codesign with "item could not be found in the
      # keychain". Instead the signing env vars are exported conditionally in
      # the "Configure signing environment" step below, so they are genuinely
      # ABSENT from the environment when no Apple secrets are configured. Only
      # then does Tauri correctly skip signing and produce an unsigned build.
    steps:
      - uses: actions/checkout@v4

      - name: Configure signing environment
        # Export the Apple signing env vars ONLY when the secret is present, so
        # they are genuinely ABSENT (not empty-string) when unset. This is what
        # tells Tauri to skip signing on an unsigned build — see the env block
        # comment above. Also sets a has_signing output for downstream gating.
        id: signing
        shell: bash
        run: |
          if [ -n "${{ secrets.APPLE_SIGNING_IDENTITY }}" ]; then
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}" >> "$GITHUB_ENV"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
            echo "Signing configured."
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "No Apple signing secrets — building unsigned."
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          cache-targets: true

      - name: Install frontend deps
        run: npm ci
        working-directory: app

      - name: Download Intel backend
        uses: actions/download-artifact@v4
        with:
          name: macos-backend-x86_64
          path: app/src-tauri/binaries

      - name: Download Apple Silicon backend
        uses: actions/download-artifact@v4
        with:
          name: macos-backend-aarch64
          path: app/src-tauri/binaries

      - name: Download cua-driver (macOS universal)
        run: |
          CUA_VERSION="0.5.7"
          curl -fsSL "https://github.com/trycua/cua/releases/download/cua-driver-rs-v${CUA_VERSION}/cua-driver-rs-${CUA_VERSION}-darwin-universal-binary.tar.gz" -o /tmp/cua-driver.tar.gz
          tar -xzf /tmp/cua-driver.tar.gz -C /tmp/
          cp /tmp/cua-driver app/src-tauri/binaries/cua-driver
          chmod +x app/src-tauri/binaries/cua-driver

      - name: Download CuaDriver.app bundle (for first-run auto-install)
        run: |
          CUA_VERSION="0.5.7"
          curl -fsSL "https://github.com/trycua/cua/releases/download/cua-driver-rs-v${CUA_VERSION}/cua-driver-rs-${CUA_VERSION}-darwin-universal.tar.gz" -o /tmp/cua-app.tar.gz
          tar -xzf /tmp/cua-app.tar.gz -C /tmp/
          # prepare-bundle.cjs reads ZWORK_CUADRIVER_APP and dittos the real
          # .app into the bundle. Without this, the CI runner has no
          # /Applications/CuaDriver.app, so the build ships a placeholder and
          # the first-run auto-install is silently broken.
          echo "ZWORK_CUADRIVER_APP=/tmp/cua-driver-rs-${CUA_VERSION}-darwin-universal/CuaDriver.app" >> "$GITHUB_ENV"

      - name: Inject signing config (when secrets present)
        # Patch tauri.conf.json to add signingIdentity + entitlements ONLY when
        # APPLE_SIGNING_IDENTITY is configured. Gate on the signing step's
        # output (env var is absent, not empty, when no secret is set).
        if: steps.signing.outputs.has_signing == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("app/src-tauri/tauri.conf.json")
          conf = json.loads(p.read_text())
          conf["bundle"]["macOS"]["signingIdentity"] = "${APPLE_SIGNING_IDENTITY}"
          conf["bundle"]["macOS"]["entitlements"] = "entitlements.plist"
          p.write_text(json.dumps(conf, indent=2) + "\n")
          print("Injected signingIdentity + entitlements into tauri.conf.json")
          PY

      - name: Build universal macOS app
        run: bash scripts/build-macos-universal-release.sh

      - name: Notarize & staple macOS app
        # Only run when Apple notarization credentials are configured (gated on
        # the signing step's output). Dev/preview builds skip this and ship
        # unsigned. `--keychain-profile` stores credentials in the runner's
        # keychain so the password isn't passed on every invocation.
        if: steps.signing.outputs.has_signing == 'true'
        env:
          NOTARY_PROFILE: zwork-notarize
        shell: bash
        run: |
          set -euo pipefail
          ROOT_DIR="$GITHUB_WORKSPACE"
          APP_PATH="$(ls "$ROOT_DIR"/app/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app 2>/dev/null | head -n1)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle found to notarize." >&2
            exit 1
          fi
          echo "Notarizing $APP_PATH"
          # Store credentials in the runner keychain (notarytool requirement
          # since macOS 12 — the password can't be passed on each submit).
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"
          # notarytool needs a zip of the .app bundle for submission.
          ditto -c -k --keepParent "$APP_PATH" "$APP_PATH.zip"
          # Submit and wait — blocks until Apple finishes (usually <5 min).
          # Exits non-zero if the notarization is REJECTED, failing the build
          # so a bad binary never reaches users.
          xcrun notarytool submit "$APP_PATH.zip" \
            --keychain-profile "$NOTARY_PROFILE" \
            --wait
          # Staple the notarization ticket back onto the bundle so offline
          # Gatekeeper checks pass without a round-trip to Apple's servers.
          xcrun stapler staple "$APP_PATH"
          rm -f "$APP_PATH.zip"
          echo "Notarization + stapling complete."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/*

  release:
    needs: [build, macos-universal]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: "*-build"

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release body
        env:
          APPLE_SIGNED: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
          WINDOWS_SIGNED: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT != '' }}
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          VERSION_NUM="${VERSION#v}"
          if printf '%s' "$VERSION_NUM" | grep -qi 'alpha'; then
            export ZWORK_RELEASE_CHANNEL="alpha"
          elif printf '%s' "$VERSION_NUM" | grep -qi 'beta'; then
            export ZWORK_RELEASE_CHANNEL="beta"
          else
            export ZWORK_RELEASE_CHANNEL="stable"
          fi
          # Reflect actual signing status in the install notes so users aren't
          # told to bypass Gatekeeper/SmartScreen on a signed build, and ARE
          # warned on an unsigned one.
          if [ "${APPLE_SIGNED}" = "true" ]; then
            MACOS_NOTE='Signed & notarized — double-click the .dmg to install normally.'
          else
            MACOS_NOTE='Unsigned build — if macOS blocks the install, right-click → Open, or use the cURL installer below.'
          fi
          if [ "${WINDOWS_SIGNED}" = "true" ]; then
            WINDOWS_NOTE='Signed installer — run normally.'
          else
            WINDOWS_NOTE='Unsigned build — if SmartScreen appears, click \"More info\" then \"Run anyway\".'
          fi
          export MACOS_NOTE WINDOWS_NOTE
          python3 -c "
          import os
          import re
          with open('CHANGELOG.md') as f:
              text = f.read()
          # extract the section for this version
          pattern = r'## v' + re.escape('${VERSION_NUM}') + r'\n(.*?)(?=\n## |\Z)'
          m = re.search(pattern, text, re.DOTALL)
          changes = m.group(1).strip() if m else 'See CHANGELOG.md for details.'
          ch = os.environ.get('ZWORK_RELEASE_CHANNEL', '')
          if ch == 'alpha':
              prefix = 'This is an alpha test build. Expect rough edges, but updater/install/auth flows should be exercised end-to-end.\n\n'
          elif ch == 'beta':
              prefix = 'This is a beta build. Core features are functional but may still have issues. Feedback welcome.\n\n'
          else:
              prefix = ''
          body = '''Download zWork for your platform:

          | Platform | File |
          |----------|------|
          | **Linux** | \`zWork-linux-x86_64.AppImage\` |
          | **macOS** | \`zWork-macos-universal.dmg\` |
          | **Windows** | \`zWork-windows-x86_64-setup.exe\` |

          ### Install

          **Linux** (recommended):
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/Ryz3nPlayZ/zWork/main/scripts/install.sh | bash
          \`\`\`
          Or download the \`.AppImage\` and run:
          \`\`\`bash
          chmod +x zWork-linux-x86_64.AppImage
          ./zWork-linux-x86_64.AppImage
          \`\`\`

          **macOS**:
          ''' + os.environ.get('MACOS_NOTE', '') + '''
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/Ryz3nPlayZ/zWork/main/scripts/install-macos.sh | bash
          \`\`\`
          Or download \`zWork-macos-universal.dmg\`, open it, then drag zWork to Applications.

          **Windows**:
          ''' + os.environ.get('WINDOWS_NOTE', '') + '''
          \`\`\`powershell
          irm https://raw.githubusercontent.com/Ryz3nPlayZ/zWork/main/scripts/install-windows.ps1 | iex
          \`\`\`

          ---

          ## What\'s new

          ''' + prefix + changes
          with open('/tmp/release-body.md', 'w') as f:
              f.write(body)
          "

      - name: Build updater manifest
        run: python3 scripts/generate-updater-manifest.py --dist dist --tag "${{ steps.version.outputs.tag }}" --repo "Ryz3nPlayZ/zWork"

      - name: Verify shipped artifacts match the release tag
        shell: bash
        run: |
          set -euo pipefail
          # Defense-in-depth: the Verify job already checks the in-repo
          # version matches the tag, and each build job stamps that version
          # into its binary. Re-check the stamped version here so a stale
          # build artifact (from a moved tag or a re-used cache) can never
          # be published under a tag it disagrees with. The v0.5.0 release
          # shipped beta.12 binaries; this check would have caught it.
          TAG_NAME="${{ steps.version.outputs.tag }}"
          EXPECTED="${TAG_NAME#v}"
          echo "Release tag: $TAG_NAME (expecting embedded version $EXPECTED)"
          echo
          # macOS: read CFBundleShortVersionString from the .app.tar.gz
          MACOS_TGZ="$(ls dist/zWork-macos-*.app.tar.gz 2>/dev/null | head -n1 || true)"
          if [ -n "$MACOS_TGZ" ]; then
            PLIST_VER="$(tar -xzOf "$MACOS_TGZ" '**/Info.plist' 2>/dev/null \
              | grep -A1 'CFBundleShortVersionString' | grep '<string>' | head -n1 \
              | sed 's/.*<string>\([^<]*\)<\/string>.*/\1/' || true)"
            echo "macOS Info.plist version: ${PLIST_VER:-<not found>}"
            if [ -n "$PLIST_VER" ] && [ "$PLIST_VER" != "$EXPECTED" ]; then
              echo "::error::macOS app bundle reports version '$PLIST_VER' but release tag is '$EXPECTED'. Refusing to publish a mislabeled binary." >&2
              exit 1
            fi
          fi
          # Windows: the NSIS .sig's trusted-comment line embeds the
          # installer filename, which Tauri derives from tauri.conf.json
          # at build time (zWork_<version>_x64-setup.exe).
          WIN_SIG="$(ls dist/zWork-windows-*-setup.exe.sig 2>/dev/null | head -n1 || true)"
          if [ -n "$WIN_SIG" ]; then
            SIG_NAME="$(grep -oE 'file:zWork_[^ ]+_x64-setup\.exe' "$WIN_SIG" | head -n1 || true)"
            echo "Windows .sig embedded filename: ${SIG_NAME:-<not found>}"
            if [ -n "$SIG_NAME" ] && ! printf '%s' "$SIG_NAME" | grep -q "zWork_${EXPECTED}_"; then
              echo "::error::Windows installer signature references '$SIG_NAME' but release tag expects version '$EXPECTED'. The binary was built from a different version. Refusing to publish." >&2
              exit 1
            fi
          fi
          echo "All shipped artifacts report version $EXPECTED."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: zWork ${{ steps.version.outputs.tag }}
          files: dist/*
          body_path: /tmp/release-body.md
          make_latest: true
