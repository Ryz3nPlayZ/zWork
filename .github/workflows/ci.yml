name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: ./app
        run: npm ci
      - name: Check TypeScript types
        working-directory: ./app
        run: npx tsc --noEmit
      - name: Build
        working-directory: ./app
        run: npm run build

  sidecar-tests:
    name: Sidecar Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sidecar-rust -> target
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - name: Run cargo test
        working-directory: ./sidecar-rust
        run: cargo test

  cloud-api-check:
    name: Cloud API cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cloud-src/api -> target
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - name: cargo check
        working-directory: ./cloud-src/api
        run: cargo check

  tauri-check:
    name: Tauri app cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev pkg-config
      # Tauri's build script globs several bundled resources (tauri.conf.json)
      # and hard-fails if ANY glob matches nothing: binaries/cua-driver*,
      # zWork-Skills/**/*, CuaDriver.app/**/*. The real artifacts are
      # platform-specific / gitignored and only staged by release.yml (which
      # downloads cua-driver per-OS and dittos CuaDriver.app, and by
      # prepare-bundle.cjs for zWork-Skills). For this type-check we only need
      # the globs to resolve — placeholder files are sufficient and keep CI
      # from depending on macOS-only / build-machine-only artifacts.
      - name: Stage placeholder bundled resources
        working-directory: ./app/src-tauri
        run: |
          mkdir -p binaries zWork-Skills CuaDriver.app/Contents/MacOS
          [ -f binaries/cua-driver ] || { echo '#!/bin/sh' > binaries/cua-driver; chmod +x binaries/cua-driver; }
          [ -f zWork-Skills/.placeholder ] || echo 'CI placeholder — real skills staged by prepare-bundle.cjs' > zWork-Skills/.placeholder
          [ -f CuaDriver.app/Contents/MacOS/cua-driver ] || { echo '#!/bin/sh' > CuaDriver.app/Contents/MacOS/cua-driver; chmod +x CuaDriver.app/Contents/MacOS/cua-driver; }
      - name: cargo check
        working-directory: ./app/src-tauri
        run: cargo check

  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown links
        run: |
          npm install -g markdown-link-check
          failed=0
          # Only check OUR documentation. A previous `find .` walked the whole
          # repo and hit vendored third-party content (zWork-Skills/ skill
          # READMEs with inherently flaky external links to figma/firecrawl/
          # npm, plus tool-generated planning dirs) — none of which we maintain
          # or can fix. Scope to docs/, the root README, and .github/.
          # Config (.markdown-link-check.json) ignores GitHub meta-pages
          # (/stargazers, /discussions) that 404 based on repo state.
          while IFS= read -r -d '' f; do
            markdown-link-check --config .markdown-link-check.json "$f" || failed=1
          done < <(find docs .github -name "*.md" -not -path "*/node_modules/*" -print0)
          [ -f README.md ] && markdown-link-check --config .markdown-link-check.json README.md || failed=1
          if [ "$failed" -ne 0 ]; then
            echo "Markdown link check failed for one or more files"
            exit 1
          fi
      - name: Check for TODO/FIXME comments
        run: |
          if grep -r "TODO\|FIXME" --include="*.py" --include="*.ts" --include="*.tsx" .; then
            echo "::warning::TODO/FIXME comments found (non-blocking)"
          else
            echo "No TODOs found"
          fi
