[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zwork-bench"
version = "0.1.0"
description = "SWE-bench Verified harness for the zWork coding agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Official SWE-bench toolchain: dataset loader + Docker image build/run +
    # the FAIL_TO_PASS / PASS_TO_PASS grader. Pin a known-good release so our
    # resolved-rate numbers stay reproducible across runs.
    "swebench>=3,<5",
    "datasets>=2.18,<4",
    "docker>=7,<8",
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
    "rich>=13,<14",
    "pyyaml>=6,<7",
]

[project.scripts]
zwork-bench = "zwork_bench.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["zwork_bench*"]
