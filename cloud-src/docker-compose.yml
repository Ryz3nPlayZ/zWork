services:
  # 1. Reverse Proxy (Caddy)
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - /var/www/app.tryzwork.app:/var/www/app.tryzwork.app
      - /var/www/admin.tryzwork.app:/var/www/admin.tryzwork.app
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - axum_api
      - better_auth

  # 2. Auth Service (Better Auth)
  better_auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://zwork:${POSTGRES_PASSWORD}@postgres:5432/zwork_db
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=https://api.tryzwork.app
      - APP_PUBLIC_URL=${APP_PUBLIC_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
    depends_on:
      - postgres

  # 3. Rust (Axum) API Proxy
  axum_api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://zwork:${POSTGRES_PASSWORD}@postgres:5432/zwork_db
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - POSTHOG_API_KEY=${POSTHOG_API_KEY}
      - POSTHOG_HOST=${POSTHOG_HOST}
      - OWNER_EMAILS=${OWNER_EMAILS}
      - ENABLE_HOSTED_GATEWAY=${ENABLE_HOSTED_GATEWAY}
      - ENABLE_BILLING=${ENABLE_BILLING}
      - ENABLE_EMAIL_AUTH=${ENABLE_EMAIL_AUTH}
      - ENABLE_COUPONS=${ENABLE_COUPONS}
      - AUTH_INTERNAL_BASE=http://better_auth:3000/api/auth
      - ROUTER_LABEL=${ROUTER_LABEL}
      - STRIPE_PRICE_PRO_MONTHLY=${STRIPE_PRICE_PRO_MONTHLY}
      - STRIPE_PRICE_PRO_ANNUAL=${STRIPE_PRICE_PRO_ANNUAL}
      - STRIPE_PRICE_MAX_MONTHLY=${STRIPE_PRICE_MAX_MONTHLY}
      - STRIPE_PRICE_MAX_ANNUAL=${STRIPE_PRICE_MAX_ANNUAL}
      - PRO_PRICE_MONTHLY_USD=${PRO_PRICE_MONTHLY_USD:-12}
      - PRO_PRICE_ANNUAL_MONTHLY_USD=${PRO_PRICE_ANNUAL_MONTHLY_USD:-10}
      - MAX_PRICE_MONTHLY_USD=${MAX_PRICE_MONTHLY_USD:-50}
      - MAX_PRICE_ANNUAL_MONTHLY_USD=${MAX_PRICE_ANNUAL_MONTHLY_USD:-41.67}
      - AUTH_SESSION_URL=http://better_auth:3000/api/auth/get-session
      - ZWORK_GATEWAY_TOKEN=${ZWORK_GATEWAY_TOKEN}
      - MAX_CONCURRENT_ROOT_RUNS=${MAX_CONCURRENT_ROOT_RUNS}
      - PRO_MAX_CONCURRENT_ROOT_RUNS=${PRO_MAX_CONCURRENT_ROOT_RUNS}
      - MAX_MAX_CONCURRENT_ROOT_RUNS=${MAX_MAX_CONCURRENT_ROOT_RUNS}
      - DEV_COUPON_CODES=${DEV_COUPON_CODES}
      - COMPOSIO_API_KEY=${COMPOSIO_API_KEY}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_TOKEN_SECRET=${ADMIN_TOKEN_SECRET}
      - ADMIN_TOKEN_TTL_HOURS=${ADMIN_TOKEN_TTL_HOURS}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL}
      - DEMO_ENABLED=${DEMO_ENABLED:-true}
      - DEMO_DAILY_REQUESTS_PER_IP=${DEMO_DAILY_REQUESTS_PER_IP:-50}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_ANTHROPIC_BASE_URL=${OPENROUTER_ANTHROPIC_BASE_URL:-https://openrouter.ai/api}
      - PRO_WEEKLY_USD=${PRO_WEEKLY_USD:-0.92}
      - MAX_WEEKLY_USD=${MAX_WEEKLY_USD:-3.83}
      - FREE_POOL_WEEKLY_USD=${FREE_POOL_WEEKLY_USD:-15}
      - FREE_USER_WEEKLY_MIN_USD=${FREE_USER_WEEKLY_MIN_USD:-0.03}
      - FREE_USER_WEEKLY_MAX_USD=${FREE_USER_WEEKLY_MAX_USD:-0.10}
      - FREE_PRO_MESSAGES_30D=${FREE_PRO_MESSAGES_30D:-3}
      - FIVE_HOUR_SHARE=${FIVE_HOUR_SHARE:-0.35}
      - CONTINUATION_HEADROOM=${CONTINUATION_HEADROOM:-1.5}
      - USAGE_UNIT_USD=${USAGE_UNIT_USD:-0.008}
    depends_on:
      - postgres
      - better_auth

  # 4. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=zwork
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=zwork_db
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  caddy_data:
  caddy_config:
  pg_data:
