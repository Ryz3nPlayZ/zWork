[package]
name = "zwork"
version = "0.7.1"
description = "zWork desktop assistant"
authors = ["Sidecar"]
edition = "2021"

[[bin]]
name = "zwork"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tokio = { version = "1", features = ["net", "time"] }
tauri-plugin-global-shortcut = "2"
# A second launch focuses the running app (closing only hides it to the tray).
tauri-plugin-single-instance = "2"
uuid = { version = "1", features = ["v4"] }
# PNG -> base64 data_url for Share Window screenshots (matches the frontend's
# existing { data_url, mime } contract from the cua-driver path).
base64 = "0.22"
# shortcut: pinned because 2.7 forces a Tauri and wry upgrade; unpin with the next Tauri bump.
tauri-plugin-autostart = "=2.5.1"

# The Dock icon choice (Settings > Appearance). Same versions Tauri already builds.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
